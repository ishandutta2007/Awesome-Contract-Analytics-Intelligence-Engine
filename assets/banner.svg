<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <!-- Filters -->
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-35px, 25px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -80; }
    }
    @keyframes pillBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .orb1 {
      animation: floatOrb1 10s ease-in-out infinite, pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb2 {
      animation: floatOrb2 12s ease-in-out infinite, pulseGlow 8s ease-in-out infinite;
      transform-origin: 1000px 300px;
    }
    .stream-line {
      stroke-dasharray: 8 12;
      animation: dashMove 6s linear infinite;
    }
    .pill-item {
      animation: pillBounce 4s ease-in-out infinite;
    }
    .pill-item:nth-child(2) { animation-delay: 0.8s; }
    .pill-item:nth-child(3) { animation-delay: 1.6s; }
    .pill-item:nth-child(4) { animation-delay: 2.4s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Ambient Orbs (Background layer) -->
  <g class="orb1">
    <circle cx="180" cy="90" r="220" fill="url(#glowGrad1)" />
  </g>
  <g class="orb2">
    <circle cx="1020" cy="330" r="240" fill="url(#glowGrad2)" />
  </g>

  <!-- Geometric Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Decorative Neural/Data Streams (Background layer) -->
  <g opacity="0.45">
    <path class="stream-line" d="M 50 80 Q 300 20 600 70 T 1150 50" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <path class="stream-line" d="M 50 360 Q 400 390 750 340 T 1150 370" fill="none" stroke="#c084fc" stroke-width="1.8" />
    <path class="stream-line" d="M 100 210 Q 550 160 1100 210" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.3" />
  </g>

  <!-- Decorative Border Frame -->
  <rect x="12" y="12" width="1176" height="396" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.35" rx="14" />

  <!-- Dynamic Feature Badges / Pills (Foreground Layer below title) -->
  <g id="pills" transform="translate(180, 50)">
    <g class="pill-item" transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="36" rx="18" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="20" cy="18" r="5" fill="#38bdf8" />
      <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Clause Extraction</text>
    </g>
    <g class="pill-item" transform="translate(200, 0)">
      <rect x="0" y="0" width="195" height="36" rx="18" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="20" cy="18" r="5" fill="#818cf8" />
      <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Portfolio Risk Scoring</text>
    </g>
    <g class="pill-item" transform="translate(415, 0)">
      <rect x="0" y="0" width="205" height="36" rx="18" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="20" cy="18" r="5" fill="#c084fc" />
      <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Obligation Tracking</text>
    </g>
    <g class="pill-item" transform="translate(640, 0)">
      <rect x="0" y="0" width="190" height="36" rx="18" fill="url(#pillGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="20" cy="18" r="5" fill="#34d399" />
      <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Legal Knowledge Graphs</text>
    </g>
  </g>

  <!-- Main Hero Typography (Guaranteed Unobscured Foreground) -->
  <!-- Top Category Tag -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3.5" fill="#38bdf8">
    ENTERPRISE LEGALTECH &amp; AI INTELLIGENCE ECOSYSTEM
  </text>

  <!-- Primary Title -->
  <text x="600" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" fill="#ffffff" filter="url(#cardGlow)">
    Contract Analytics &amp; Intelligence Engine
  </text>

  <!-- Accent Divider -->
  <rect x="520" y="230" width="160" height="3.5" rx="1.75" fill="url(#accentGrad)" />

  <!-- Subtitle -->
  <text x="600" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
    Curated Hub of Market-Leading SaaS Platforms &amp; Open-Source Legal AI Engines
  </text>

  <!-- Meta Bulletpoints (Bottom foreground) -->
  <g transform="translate(250, 320)">
    <!-- SaaS Indicator -->
    <rect x="0" y="0" width="210" height="40" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
    <text x="105" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">
      💼 10+ Enterprise SaaS
    </text>

    <!-- Open Source Indicator -->
    <rect x="245" y="0" width="210" height="40" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
    <text x="350" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">
      ⚡ Open-Source &amp; Models
    </text>

    <!-- Pricing/Free Tier Audited -->
    <rect x="490" y="0" width="210" height="40" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
    <text x="595" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">
      🔍 Audited Pricing &amp; Scale
    </text>
  </g>
</svg>
