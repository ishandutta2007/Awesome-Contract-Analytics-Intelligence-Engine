<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b19"/><stop offset="45%" stop-color="#0f172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glowGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></linearGradient><linearGradient id="glowGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#c084fc" stop-opacity=".22"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><linearGradient id="pillGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".85"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity=".3"/></pattern><filter id="cardGlow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#38bdf8" flood-opacity=".15" stdDeviation="12"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes floatOrb1{0%{transform:translate(0,0)}50%{transform:translate(30px,-20px)}}@keyframes floatOrb2{0%{transform:translate(0,0)}50%{transform:translate(-35px,25px)}}@keyframes dashMove{0%{stroke-dashoffset:0}}@keyframes pillBounce{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}.orb1{animation:floatOrb1 10s ease-in-out infinite,pulseGlow 6s ease-in-out infinite;transform-origin:200px 100px}.orb2{animation:floatOrb2 12s ease-in-out infinite,pulseGlow 8s ease-in-out infinite;transform-origin:1000px 300px}.stream-line{stroke-dasharray:8 12;animation:dashMove 6s linear infinite}.pill-item{animation:pillBounce 4s ease-in-out infinite}.pill-item:nth-child(2){animation-delay:.8s}.pill-item:nth-child(3){animation-delay:1.6s}.pill-item:nth-child(4){animation-delay:2.4s}</style><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><g class="orb1"><circle cx="180" cy="90" r="220" fill="url(#glowGrad1)"/></g><g class="orb2"><circle cx="1020" cy="330" r="240" fill="url(#glowGrad2)"/></g><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g opacity=".45"><path fill="none" stroke="#38bdf8" stroke-width="1.8" d="M 50 80 Q 300 20 600 70 T 1150 50" class="stream-line"/><path fill="none" stroke="#c084fc" stroke-width="1.8" d="M 50 360 Q 400 390 750 340 T 1150 370" class="stream-line"/><path fill="none" stroke="#818cf8" stroke-width="1.2" d="M 100 210 Q 550 160 1100 210" class="stream-line" opacity=".3"/></g><rect width="1176" height="396" x="12" y="12" fill="none" stroke="url(#accentGrad)" stroke-opacity=".35" stroke-width="1.5" rx="14"/><g id="pills"><g class="pill-item" transform="translate(180, 50) translate(0, 0)"><rect width="180" height="36" x="0" y="0" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity=".7" stroke-width="1.2" rx="18"/><circle cx="20" cy="18" r="5" fill="#38bdf8"/><text x="35" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Clause Extraction</text></g><g class="pill-item" transform="translate(180, 50) translate(200, 0)"><rect width="195" height="36" x="0" y="0" fill="url(#pillGrad)" stroke="#818cf8" stroke-opacity=".7" stroke-width="1.2" rx="18"/><circle cx="20" cy="18" r="5" fill="#818cf8"/><text x="35" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Rob